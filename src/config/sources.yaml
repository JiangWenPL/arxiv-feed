# arxiv-feed source configuration

arxiv:
  queries:
    latest_research:
      # 3D Gaussian Splatting and neural rendering
      - category: "cs.CV"
        keywords: ["gaussian splatting", "3DGS", "neural rendering", "radiance field", "NeRF", "point-based rendering", "3D reconstruction"]
        subcategory: "3dgs"
      - category: "cs.GR"
        keywords: ["gaussian splatting", "neural rendering", "differentiable rendering"]
        subcategory: "3dgs"

    ml_infra:
      - category: "cs.AR"
        keywords: ["flash attention", "KV cache", "quantization", "model serving", "inference optimization", "CUDA kernel", "GPU optimization", "tensor parallel", "model parallel", "mixed precision"]
        subcategory: "ml_infra"
      - category: "cs.DC"
        keywords: ["distributed training", "pipeline parallel", "data parallel", "gradient compression"]
        subcategory: "ml_infra"
      - category: "cs.LG"
        keywords: ["efficient transformer", "attention mechanism", "model compression", "pruning", "distillation", "sparse attention"]
        subcategory: "ml_infra"

    learning_methods:
      - category: "cs.LG"
        keywords: ["RLHF", "DPO", "alignment", "reward model", "pretraining", "scaling law", "in-context learning", "chain of thought", "fine-tuning", "self-supervised"]
        subcategory: "learning_methods"
      - category: "cs.CL"
        keywords: ["language model", "instruction tuning", "constitutional AI", "RLHF"]
        subcategory: "learning_methods"

    general_reading:
      - category: "math.OC"
        keywords: ["convex optimization", "stochastic optimization", "online learning"]
        subcategory: "math"
      - category: "stat.ML"
        keywords: ["statistical learning", "high-dimensional", "concentration inequality"]
        subcategory: "math"
      - category: "q-fin.MF"
        keywords: ["stochastic calculus", "option pricing", "portfolio optimization", "risk"]
        subcategory: "quant"

  max_results_per_query: 20
  days_lookback: 7

